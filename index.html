function makeSegment(text,i){const sizes=options.shotSize,angles=options.cameraAngle,moves=options.cameraMove,layouts=options.videoLayout;return {text:String(text||''),shotSize:sizes[Math.min(sizes.length-1,1+(i%3))],cameraAngle:angles[i%angles.length],cameraMove:moves[i%moves.length],videoLayout:layouts[i%layouts.length],motion:options.motion[i%options.motion.length],motionMood:options.motionMood[i%options.motionMood.length],clipLength:'約5秒'}}
function splitDialogue(text){const source=String(text||'').trim();if(!source)return [];const clauses=source.match(/[^，,。！？!?；;\n]+[，,。！？!?；;]?|\n+/g)||[source];const out=[];let part='';for(let clause of clauses){if(/^\s+$/.test(clause)){if(part){out.push(part);part=''}continue}clause=clause.trim();while(clause.length>22){if(part){out.push(part);part=''}out.push(clause.slice(0,22));clause=clause.slice(22)}if(clause){if(part&&part.length+clause.length>22){out.push(part);part=clause}else part+=clause}}if(part)out.push(part);return out.map((t,i)=>makeSegment(t,i))}
function sanitizeSegments(input){if(!Array.isArray(input))return [];return input.slice(0,20).map((s,i)=>{const n=makeSegment(s?.text,i);for(const k of ['shotSize','cameraAngle','cameraMove','videoLayout','motion','motionMood','clipLength'])if(options[k]?.includes(s?.[k]))n[k]=s[k];return n}).filter(s=>s.text.trim())}
function syncSegmentsToDialogue(text=voiceText(),force=false){const source=String(text||'').trim();if(!force&&Array.isArray(state.segments)&&state.segmentSourceText===source&&(source===''||state.segments.length>0))return false;const previous=Array.isArray(state.segments)?state.segments:[];state.segments=splitDialogue(source).map((part,i)=>({...part,...(previous[i]||{}),text:part.text}));state.segmentSourceText=source;return true}
function segmentPrompt(s,i){const count=state.segments.length,chars=s.text.replace(/\s/g,'').length,seconds=Math.max(1,Math.ceil(chars/4));const refs=i===0?'請同時使用角色定稿圖和場景圖片作為參考。':`請同時使用角色定稿圖、場景圖片，以及第${i}段影片最後一幀的截圖作為參考；以前一段最後一幀銜接本段的角色位置、姿勢和畫面方向，場景圖片用來保持環境一致。`;const handoff=i<count-1?`\n【交接給下一段】生成完成後，請保留本段影片的最後一幀截圖；第${i+2}段生成時，必須把這張截圖與角色定稿圖、場景圖片一起作為參考。`:'\n【最後一段】這是本片最後一段，請讓角色動作與口白自然收尾。';return `【動畫第${i+1}段／共${count}段；${s.clipLength}】\n${refs}這是連續影片中的第${i+1}段，接續前段情緒與動作；本段只呈現一個完整鏡頭。角色和場景畫風固定為「${val('style')}」，不得改變。\n【本段口白】角色逐字說：「${s.text}」。不可改寫、漏字或加字。配音：${voicePersona()}；語氣${val('voice')}；繁體中文自然口語。若工具支援，讓語音和角色口型／表情同步；否則另生成完全相同文字的 AI 配音音訊。\n【本段鏡頭】景別：${s.shotSize}；角度：${s.cameraAngle}；運鏡：${s.cameraMove}；構圖：${s.videoLayout}。\n【本段表演】角色${s.motion}，情緒${s.motionMood}。場景維持${val('scenePlace')}，動作自然且符合口白。\n【規格】片長${s.clipLength}；比例${val('videoRatio')}；口白約需${seconds}秒（以每秒約4個中文字估算）；若超過片長，請再拆短，不要加速朗讀。\n【避免】不要新增角色、改變角色造型、切換場景、加入字幕或文字，不要快速抖動或突然跳切。${handoff}`}
function segmentField(i,k,label){return `<div class="field"><label>${label}</label><select data-segment-select="${k}" data-segment-index="${i}">${options[k].map(v=>`<option ${state.segments[i][k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`}
function segmentCard(i,s){const chars=s.text.replace(/\s/g,'').length,estimate=Math.max(1,Math.ceil(chars/4)),limit=Number.parseInt(s.clipLength,10)||5;return `<article class="preview segment-card"><div class="actions"><h3>第 ${i+1} 段 · ${s.clipLength} · <span data-segment-meta="${i}">約 ${estimate} 秒口白</span></h3><button data-copy-segment="${i}">複製本段提示詞</button><button data-remove-segment="${i}" ${state.segments.length===1?'disabled':''}>刪除這段</button></div><label class="field"><span>本段角色口白</span><textarea data-segment-text="${i}" rows="3" maxlength="120" style="width:100%;border:1px solid #bdcdc2;background:white;border-radius:8px;padding:11px 12px;color:var(--ink);font:inherit">${esc(s.text)}</textarea></label><p class="error" data-segment-warning="${i}" ${estimate>limit?'':'hidden'}>這段口白可能長於影片時間，建議再拆短或增加片長。</p><div class="grid">${segmentField(i,'shotSize','鏡位／景別')}${segmentField(i,'cameraAngle','鏡頭角度')}${segmentField(i,'cameraMove','運鏡方式')}${segmentField(i,'videoLayout','構圖')}${segmentField(i,'motion','角色動作')}${segmentField(i,'motionMood','角色情緒')}${segmentField(i,'clipLength','影片片長')}</div><p class="help">${i<state.segments.length-1?'生成後截取本段最後一幀，下一段會把它與場景圖、角色定稿圖一起當參考。':'最後一段，請讓口白和動作自然收尾。'}</p><h3>本段提示詞預覽</h3><div class="prompt" data-segment-prompt="${i}">${esc(segmentPrompt(s,i))}</div></article>`}
function segmentControls(){syncSegmentsToDialogue();return `<h2>三、依口白拆分影片段落（<span id="segmentCount">${state.segments.length}</span> 段）</h2><p class="help">口白每次變更都會重新分段；文字較長時會增加動畫提示詞段數。再為每段選擇鏡位、角度、運鏡、構圖和動作。</p><div class="notice">生成順序：第1段使用角色定稿圖與場景圖；每完成一段，截取它的最後一幀，下一段同時上傳角色定稿圖、場景圖與這張最後一幀。</div><div class="actions"><button data-split-segments>依目前口白重新切段</button><button data-add-segment>新增一段</button></div><p class="help">中文字數以每秒約4字估算，實際說話速度以生成結果為準。更改口白會保留對應段落的鏡頭設定；新增加的段落使用預設設定。最多20段。</p><div id="segmentCards">${state.segments.length?state.segments.map((s,i)=>segmentCard(i,s)).join(''):'<p class="help">口白目前是空白。輸入口白後，動畫段數會自動更新。</p>'}</div>`}

return `【身形與比例】${val('body')}，${val('proportion')}。
【外觀類型】${type}

function characterForm(){const group=(title,items)=>`<h2>${title}</h2><div class="grid">${items.map(([k,l])=>detailField(k,l)).join('')}</div>`;const k=val('kind');return `<p class="eyebrow">STEP 02 / 角色設計師</p><h1>從眼睛到鞋子，設計你的 AI 分身</h1><p class="lead">每一個選擇都會加入角色定稿提示詞。已有預設範例，也能選「自訂」。</p><div class="grid">${field('character','角色名字／影片暱稱',null)}${field('kind','角色類型',options.kind)}</div>${group('00 角色性別與年齡',[['characterGender','角色性別呈現'],['characterAge','角色外觀年齡']])}${group('01 身形與臉部',[['body','身形'],['proportion','頭身比例'],...(k==='機器人'?[]:[['face','臉型'],['nose','鼻子'],['mouth','嘴巴']]),['eyes','眼睛形狀'],['eyeColor','眼睛顏色'],['expression','表情']])}${group('02 '+(k==='人物角色'?'髮型與膚色':k==='機器人'?'機器人結構':k==='動物角色'?'毛髮、耳朵與尾巴':'想像生物外觀'),typeKeys().map(x=>[x,{hair:'髮型',hairColor:'頭髮顏色',skin:'膚色',fur:'身體表面',ears:'耳朵',tail:'尾巴',robotFace:'臉部面板',surface:'身體材質',light:'燈光元件',fantasy:'特殊構造'}[x]]))}${group('03 配色與辨識特徵',[['color',k==='人物角色'?'整體設計主色':'身體主色'],['accent','輔助顏色'],['mark','花紋或辨識記號']])}${group('04 服裝搭配',[['clothesMode','是否穿著服裝'],...(val('clothesMode')==='穿著服裝'?[['top','上衣或連身服'],['topColor','上衣主色'],['bottom','下裝'],['bottomColor','下裝顏色'],['shoes','鞋子'],['clothesDetail','衣服圖案或細節']]:[])])}${group('05 配件與代表物品',[['headAccessory','頭部配件'],['wearAccessory','身上配件'],['prop','代表自己的物品']])}${group('06 定稿畫面的樣子',[['style','整支影片的畫風'],['ratio','角色定稿圖比例'],['view','觀看角度'],['pose','定稿姿勢'],['background','背景'],['lighting','光線']])}<div class="preview"><div class="actions"><h3>角色定稿提示詞</h3><button data-copy="0">複製角色提示詞</button></div><div class="prompt" id="characterPrompt">${esc(characterPrompt())}</div></div><div class="notice">這一頁只定義角色長相、服裝和固定特徵。場景和動畫會在下一頁另外設計；口白聲線也會依照這裡的角色性別和年齡設定。</div>`}

 ['角色短動畫分段提示詞',state.segments.map((s,i)=>segmentPrompt(s,i)).join('\n\n──────────\n\n')],
 ['角色＋場景＋動畫整合',`請以「角色定稿圖」作為角色外觀與畫風依據，以「場景圖片」作為環境依據，依照分段分鏡製作一組連續短動畫。每段都分開生成，不要試圖把全部口白塞進同一段影片。角色、場景圖片和動畫全程統一使用「${val('style')}」畫風，不得改變媒材感、線條風格或渲染方式。\n\n【角色】${val('character')}，${role()}。個性：${val('trait')}。保留定稿圖中的臉部、眼睛、身形比例、主色、服裝、配件和畫風，不要重新設計或更換角色。\n【場景】${sceneDescription()}\n【共同聲音】配音符合${voicePersona()}，語氣${val('voice')}，使用自然清楚的繁體中文口語；不可出現成人配兒童角色、兒童配成人角色或性別聲線不符。若工具支援語音和口型同步，請配合口白；不支援時，依每段完全相同的文字分段生成 AI 配音音訊供後製合成。\n【分段台詞與分鏡】\n${state.segments.map((s,i)=>`第${i+1}段，${s.clipLength}：口白「${s.text}」；${s.shotSize}；${s.cameraAngle}；${s.cameraMove}；構圖${s.videoLayout}；角色${s.motion}；情緒${s.motionMood}。`).join('\n')}\n【參考圖接力】第1段使用角色定稿圖和場景圖片。第2段開始，每次生成都要同時加入「角色定稿圖、場景圖片，以及上一段影片最後一幀的截圖」；最後一幀必須作為下一段的畫面連續性參考，不能只沿用同一張場景圖。完成每段後，截取最後一幀並標明段落編號，再用於下一段。\n【剪接連貫】各段角色外觀、場景色彩和光線保持一致；每段只生成一個清楚鏡頭，依序銜接成完整內容。每段的口白必須逐字照讀，不改寫、不漏字、不加字。不要文字、字幕、標誌或浮水印，不新增其他角色。`],
 ['分段 AI 配音稿',`請為同一個角色分段產生 AI 配音，所有片段保持同一個聲音身份，不要改變性別聲線或年齡感。聲音方向：${voicePersona()}；說話語氣：${val('voice')}；使用自然清楚的繁體中文口語。年齡感和性別聲線要符合角色設定，不要用成人聲線配兒童角色，也不要把男性角色配成女性聲線或反過來。每段分開輸出音訊，檔名依序標示，並逐字朗讀對應口白，不增加或刪除內容：\n\n${state.segments.map((s,i)=>`V${String(i+1).padStart(2,'0')}（對應動畫第${i+1}段）：${s.text}`).join('\n\n')}`]
]}
function materials(){return [
['role','00_角色定稿','1張',`${role()}；${val('eyeColor')}眼睛、${val('color')}、${val('prop')}`],
['intro','01_我是誰','1張／段','角色出場，可重用定稿圖'],
['interest','02_我的興趣','1～2張',`${val('interest')}：${val('reason')}`],
['animal','03_像我的動物','1張',`${val('animal')}；${val('trait')}`],
['happy','04～06_快樂清單','3張',[val('happy1'),val('happy2'),val('happy3')].join('／')],
['end','07_結尾','可重用','回到角色畫面，邀請同學一起參與'],
['video',state.segments.length>1?`A01～A${String(state.segments.length).padStart(2,'0')}_動畫片段`:'A01_角色動畫',`${state.segments.length}段`,`${state.segments.map(s=>`${s.shotSize}／${s.cameraMove}`).join('；')}；片段可依序剪接`],
['voice','V01_角色口白','1段',`${voicePersona()}；${val('voice')}；確認逐字照讀與角色年齡感`],
['music','M01_配樂','1首',`${val('music')}；使用老師允許的音樂`],
['source','來源與提示詞','1份','記錄網址、工具名稱、提示詞；下載素材至同一資料夾']];}
function valid(){const needed=['nick','character','animal','trait','example','kind','color','prop','style','ratio','interest','reason','happy1','happy2','happy3','together','scene','motion','voice','music','scenePlace','sceneTime','sceneWeather','sceneObjects','sceneAction','sceneMood','sceneLight','sceneLayout','sceneRatio','videoRatio','sceneFocus','shotSize','cameraAngle','cameraMove','videoLayout','motionPath','motionSpeed','motionMood','clipLength','soundFx'];syncSegmentsToDialogue();return voiceText().length>0&&state.segments.length>0&&state.segments.every(s=>s.text.trim())&&[...needed,...detailKeys()].every(k=>val(k))}
function preview(){return `<div class="preview"><h3>完整口白預覽（與動畫及配音使用同一份文字）</h3>${voiceText().split(/\n+/).filter(Boolean).map(s=>`<p>${esc(s)}</p>`).join('')}</div>`}
function sheet(){return `<article class="sheet" id="sheet"><div class="eyebrow">第一週 / 我的 AI 分身：這就是我</div><h1>${esc(val('nick'))}的一頁執行清單</h1><div class="summary"><p><b>角色：</b>${esc(val('character'))}・${esc(role())}<br><b>動物靈感：</b>${esc(val('animal'))}；${esc(val('trait'))}<br><b>角色性別與年齡：</b>${esc(val('characterGender'))}・${esc(val('characterAge'))}</p><p><b>外觀：</b>${esc(val('color'))}／${esc(val('eyeColor'))}眼睛／${esc(val('prop'))}<br><b>畫風與比例：</b>${esc(val('style'))}・${esc(val('ratio'))}<br><b>配音方向：</b>${esc(voicePersona())}</p></div><section><h2>01 我的介紹腳本</h2><div class="script">${script().map(s=>`<p>${esc(s)}</p>`).join('')}</div></section><section><h2>02 素材交件清單</h2><table><thead><tr><th>完成／檔名</th><th>數量</th><th>要準備的內容</th></tr></thead><tbody>${materials().map(([id,name,n,desc])=>`<tr><td>${state.done[id]?'☑':'□'} ${name}</td><td>${n}</td><td>${esc(desc)}</td></tr>`).join('')}</tbody></table></section><section><h2>03 上午怎麼做（共180分鐘，休息另計）</h2><p>0～25 分：看範例、動物測驗與反思　｜　25～60 分：腳本與角色設定</p><p>60～90 分：角色定稿　｜　90～125 分：情境圖片</p><p>125～160 分：短動畫與 AI 配音　｜　160～180 分：配樂、下載與檢查</p></section><section><h2>04 下午開剪前</h2><p>□ 所有素材已下載並能開啟　□ 配音已聽過　□ 圖片對得上腳本</p><p>先完成一段動畫即可；生成等待時整理素材。失敗先用原圖，不延誤剪輯。</p></section><footer>完整角色外觀與生成提示詞請到網頁第4步複製，或下載「完整準備內容」。資料只存於此瀏覽器。第一週不要求字幕。</footer></article>`}
function render(){const n=state.step;document.querySelector('#nav').innerHTML=labels.map((s,i)=>`<button data-step="${i}" class="${n===i?'active':''}" ${n===i?'aria-current="step"':''}><span>${i<3&&state.review[i]?'✓':i+1}</span>${s}</button>`).join('');document.querySelector('#progress').textContent=`${state.review.filter(Boolean).length} / 3 項設定已確認`;
let body='';
if(n===0)body=`<p class="eyebrow">STEP 01 / 找到你的靈感</p><h1>哪一隻動物，讓你想到自己？</h1><p class="lead">先做測驗找靈感，也可以直接選一隻你認同的動物。</p><a class="quizlink" href="https://www.arealme.com/what-animal-am-i/zh/" target="_blank" rel="noopener noreferrer">開啟動物測驗 ↗</a><p class="help">測驗在新分頁開啟，結果請自己選回這裡，不會自動匯入。</p><div class="notice">結果是創作靈感，不是固定的個性標籤。你可以選不同的動物。</div><div class="grid">${field('nick','你的名字或暱稱',null,'可以用暱稱，不需要真實姓名。')}${field('quiz','動物怎麼選',['先自己選動物','採用測驗結果','參考測驗後，改選其他動物'])}${field('animal','我認同的動物',options.animal)}${field('trait','我覺得像我的特點',options.trait)}${field('example','生活中，我也會這樣',options.example)}</div>`;
if(n===1)body=characterForm();
if(n===2)body=`<p class="eyebrow">STEP 03 / 寫自己的故事</p><h1>把喜歡的事，放進影片</h1><p class="lead">選出你的興趣和快樂清單，預覽會與完整口白、分段動畫及配音共用同一份文字。</p><div class="grid">${field('interest','我喜歡',options.interest)}${field('reason','因為',options.reason)}${field('happy1','快樂清單：第一件',options.happy)}${field('happy2','快樂清單：第二件',options.happy)}${field('happy3','快樂清單：第三件',options.happy)}${field('together','邀請同學一起做什麼',options.together)}${field('voice','AI 配音的感覺',options.voice)}${field('music','背景音樂方向',options.music)}</div><div id="scriptPreview">${preview()}</div>`;
if(n===3)body=`<p class="eyebrow">STEP 04 / 場景與動畫設計</p><h1>先設計畫面，再產生提示詞</h1><p class="lead">先完成場景與動畫選項。角色提示詞只描述角色本身；場景、短動畫和整合提示詞各自有不同用途，並共用角色設定的畫風。</p>${sceneControls()}<h2>提示詞輸出</h2>${prompts().map(([title,p],i)=>`<div class="preview"><div class="actions"><h3>${i+1}. ${title}</h3><button data-copy="${i}">複製提示詞</button></div><div class="prompt" data-prompt-index="${i}">${esc(p)}</div></div>`).join('')}<h2>完成一項，勾選一項</h2>${materials().map(([id,name,n,desc])=>`<label class="material"><input type="checkbox" data-done="${id}" ${state.done[id]?'checked':''}><span><b>${name} · ${n}</b><small>${esc(desc)}</small></span></label>`).join('')}<p class="help">約6～8張可用圖片；開頭和結尾可以重用，動畫可取代其中一張圖片。</p>`;
if(n===4)body=`<div class="no-print"><p class="eyebrow">STEP 05 / 帶著清單開始做</p><h1>我的一頁執行清單</h1><p class="lead">可以列印成 A4，或在列印視窗選擇「另存為 PDF」。完整提示詞另存於文字檔。</p>${!state.review.every(Boolean)?'<div class="notice">目前還有設定未確認。請回到前三步，確認內容真的代表你。</div>':''}<div class="actions"><button class="primary" id="print">列印／另存 PDF</button><button id="download">下載完整準備內容</button><button id="backup">下載進度備份</button><button id="restore">載入進度備份</button><input type="file" accept="application/json,.json" id="restoreFile" hidden></div><p id="outputError" class="error" role="alert"></p></div>${sheet()}`;
if(n<3)body+=`<label class="check"><input type="checkbox" id="review" ${state.review[n]?'checked':''}>我已看過這一頁，這些選擇可以代表我。（不是只沿用示例）</label>`;
if(n<4)body+=`<div class="bottom no-print"><button id="prev" ${n===0?'disabled':''}>上一步</button><button class="primary" id="next">${n===3?'產生一頁執行清單':'下一步'} →</button></div><p id="stepError" class="error" role="alert"></p>`;
document.querySelector('#main').innerHTML=body;save();}
function go(n){if(n===4&&!valid()){toast('有自訂欄位尚未填寫，請補上或改選選單選項。');return}state.step=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function refreshPromptPreviews(){document.querySelectorAll('[data-prompt-index]').forEach(el=>{const p=prompts()[Number(el.dataset.promptIndex)];if(p)el.textContent=p[1]});document.querySelectorAll('[data-segment-prompt]').forEach(el=>{const i=Number(el.dataset.segmentPrompt),s=state.segments[i];if(s){el.textContent=segmentPrompt(s,i);const chars=s.text.replace(/\s/g,'').length,estimate=Math.max(1,Math.ceil(chars/4)),limit=Number.parseInt(s.clipLength,10)||5;const meta=document.querySelector(`[data-segment-meta="${i}"]`),warning=document.querySelector(`[data-segment-warning="${i}"]`);if(meta)meta.textContent=`約 ${estimate} 秒口白`;if(warning)warning.hidden=estimate<=limit}})}
function refreshSegmentCards(){const cards=document.querySelector('#segmentCards'),count=document.querySelector('#segmentCount');if(count)count.textContent=state.segments.length;if(cards)cards.innerHTML=state.segments.length?state.segments.map((s,i)=>segmentCard(i,s)).join(''):'<p class="help">口白目前是空白。輸入口白後，動畫段數會自動更新。</p>';refreshPromptPreviews()}
let timer;function toast(s){const e=document.querySelector('#toast');e.textContent=s;e.hidden=false;clearTimeout(timer);timer=setTimeout(()=>e.hidden=true,3500)}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('已複製，可以貼到指定的 AI 工具。')}catch{const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'已複製。':'無法自動複製，請直接選取提示詞文字。')}}
function download(name,s,type='text/plain;charset=utf-8'){const u=URL.createObjectURL(new Blob([s],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function complete(){if(!valid()||!state.review.every(Boolean)){document.querySelector('#outputError').textContent='請回到前三步確認設定，並補齊自訂欄位，再輸出。';return false}return true}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.segmentText!==undefined){const i=Number(el.dataset.segmentText);if(state.segments[i])state.segments[i].text=el.value;state.dialogueCustomized=true;state.dialogueText=state.segments.map(s=>s.text).join('\n');state.segmentSourceText=state.dialogueText.trim();const master=document.querySelector('#dialogueText');if(master)master.value=state.dialogueText;save();refreshPromptPreviews();return}if(el.dataset.key&&['INPUT','TEXTAREA'].includes(el.tagName)){state[el.dataset.key]=el.value;state.review[state.step]=false;if(el.dataset.key==='dialogueText'){state.dialogueCustomized=true;syncSegmentsToDialogue(el.value,true);refreshSegmentCards()}save()}if(el.dataset.custom){state.custom[el.dataset.custom]=el.value;state.review[state.step]=false;save()}if(el.matches('input[data-key],textarea[data-key],input[data-custom]')){const r=document.querySelector('#review');if(r)r.checked=false;const p=document.querySelector('#scriptPreview');if(p)p.innerHTML=preview();const cp=document.querySelector('#characterPrompt');if(cp)cp.textContent=characterPrompt();refreshPromptPreviews()}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.segmentSelect!==undefined){const i=Number(el.dataset.segmentIndex),k=el.dataset.segmentSelect;if(state.segments[i])state.segments[i][k]=el.value;save();refreshPromptPreviews();return}if(el.dataset.key&&el.tagName==='SELECT'){state[el.dataset.key]=el.value;state.review[state.step]=false;if(['kind','clothesMode'].includes(el.dataset.key)){render();document.getElementById(el.dataset.key)?.focus();return}const custom=el.parentElement.querySelector('.custom');custom.hidden=el.value!=='自訂';custom.required=el.value==='自訂';const r=document.querySelector('#review');if(r)r.checked=false;const p=document.querySelector('#scriptPreview');if(p)p.innerHTML=preview();const cp=document.querySelector('#characterPrompt');if(cp)cp.textContent=characterPrompt();refreshPromptPreviews();save()}if(el.id==='review'){state.review[state.step]=el.checked;document.querySelector('#progress').textContent=`${state.review.filter(Boolean).length} / 3 項設定已確認`;save()}if(el.dataset.done){state.done[el.dataset.done]=el.checked;save()}if(el.id==='restoreFile'&&el.files[0]){const f=el.files[0];if(f.size>100000){toast('備份檔太大，請選擇本工具匯出的 JSON。');return}f.text().then(t=>{try{const d=JSON.parse(t);if(d.version!==1||!d.state||!Array.isArray(d.state.review))throw Error();const ns={...structuredClone(defaults)};for(const k of Object.keys(defaults)){if(typeof defaults[k]==='string'&&typeof d.state[k]==='string')ns[k]=d.state[k].slice(0,['dialogueText','segmentSourceText'].includes(k)?300:30)}ns.custom={};for(const [k,v] of Object.entries(d.state.custom||{}))if(typeof v==='string'&&k in defaults)ns.custom[k]=v.slice(0,30);ns.done=Object.fromEntries(materials().map(([k])=>[k,!!d.state.done?.[k]]));ns.review=[0,1,2].map(i=>!!d.state.review[i]);ns.dialogueCustomized=typeof d.state.dialogueCustomized==='boolean'?d.state.dialogueCustomized:!!ns.dialogueText.trim();if(!d.state.eyeColor)ns.review[1]=false;state=ns;state.segments=sanitizeSegments(d.state.segments);syncSegmentsToDialogue(voiceText());ns.step=0;render();toast('進度已載入。')}catch{toast('無法讀取，請選擇本工具匯出的備份檔。')}})}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.step!==undefined)go(Number(b.dataset.step));if(b.id==='next'){const invalid=document.querySelector('#main input:invalid');if(invalid){invalid.reportValidity();return}if(state.step<3&&!state.review[state.step]){document.querySelector('#stepError').textContent='請先確認本頁選擇，再繼續。';return}go(state.step+1)}if(b.id==='prev')go(state.step-1);if(b.dataset.copy!==undefined){if(!valid()){toast('請先補齊自訂內容。');return}copy(prompts()[Number(b.dataset.copy)][1])}if(b.id==='print'&&complete())window.print();if(b.id==='download'&&complete())download('我的AI分身_完整準備內容.txt',`我的 AI 分身：${val('nick')}\n\n${prompts().map(([t,p])=>t+'\n'+p).join('\n\n')}\n\n素材清單\n${materials().map(([id,n,q,d])=>(state.done[id]?'[完成]':'[待做]')+n+' '+q+' '+d).join('\n')}`);if(b.id==='backup')download('我的AI分身_進度備份.json',JSON.stringify({version:1,state},null,2),'application/json');if(b.id==='restore')document.querySelector('#restoreFile').click();if(b.id==='reset')document.querySelector('#resetDialog').showModal();if(b.id==='cancelReset')document.querySelector('#resetDialog').close();if(b.id==='confirmReset'){state=structuredClone(defaults);document.querySelector('#resetDialog').close();render();toast('已開始新的準備單。')}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.splitSegments!==undefined){syncSegmentsToDialogue(voiceText(),true);save();render();toast(`已切成 ${state.segments.length} 段，可逐段調整鏡頭。`)}if(b.dataset.addSegment!==undefined){if(state.segments.length>=20){toast('目前最多可安排20段動畫。');return}state.segments.push(makeSegment('',state.segments.length));state.dialogueCustomized=true;state.dialogueText=state.segments.map(s=>s.text).join('\n');state.segmentSourceText=state.dialogueText.trim();save();render();document.querySelector(`[data-segment-text="${state.segments.length-1}"]`)?.focus()}if(b.dataset.removeSegment!==undefined){const i=Number(b.dataset.removeSegment);if(state.segments.length>1)state.segments.splice(i,1);state.dialogueCustomized=true;state.dialogueText=state.segments.map(s=>s.text).join('\n');state.segmentSourceText=state.dialogueText.trim();save();render()}if(b.dataset.copySegment!==undefined){const i=Number(b.dataset.copySegment),s=state.segments[i];if(s&&s.text.trim())copy(segmentPrompt(s,i));else toast('請先填寫本段口白。')}});
window.addEventListener('beforeprint',()=>{if(state.step!==4){state.step=4;render()}});render();
</script></body></html>
